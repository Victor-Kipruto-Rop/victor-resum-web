<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Victor Kipruto Rop</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="The page you requested could not be found. Return to Victor Kipruto Rop's portfolio homepage." />
  <link rel="canonical" href="https://victorkipruto.com/404.html" />
  <link rel="icon" href="/favicon-32x32.png" type="image/png" />
  <style>
    :root {
      --ink: #0a0e14;
      --paper: #f5f0e8;
      --accent: #c8401a;
      --blue: #1a4fd6;
      --muted: #7a7060;
      --rule: #d4cec2;
      --card: #ede8de;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .wrap {
      max-width: 720px;
      text-align: center;
      padding: 40px 24px;
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--rule);
      border-radius: 9999px;
      margin-bottom: 20px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      margin: 0 0 20px;
      line-height: 1;
    }
    p {
      font-size: 1.1rem;
      color: var(--muted);
      margin: 0 0 24px;
    }
    a {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">404</div>
    <h1>Page not found</h1>
    <p>The page you were looking for is unavailable or may have moved. Head back to the portfolio homepage.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
