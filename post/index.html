<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="page-title">Blog Post — Victor Kipruto Rop</title>
<meta name="description" id="page-desc" content="Technical blog post by Victor Kipruto Rop"/>
<link rel="icon" href="assets/1.jpeg" type="image/jpeg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
  :root {
    --ink:    #0a0e14;
    --paper:  #f5f0e8;
    --accent: #c8401a;
    --muted:  #7a7060;
    --rule:   #d4cec2;
    --card:   #ede8de;
  }
  
  body.dark-mode {
    --ink:    #f5f0e8;
    --paper:  #0a0e14;
    --accent: #ff4b2b;
    --muted:  #a1a1aa;
    --rule:   #27272a;
    --card:   #18181b;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    line-height: 1.8;
    padding: 0;
    transition: background 0.3s ease, color 0.3s ease;
  }
  
  /* ── Theme Toggle ── */
  .theme-toggle {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-size: 14px;
    margin-left: 20px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle .fa-sun { display: none; }
  body.dark-mode .theme-toggle .fa-moon { display: none; }
  body.dark-mode .theme-toggle .fa-sun { display: block; }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9990;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  nav {
    position: sticky; top: 0; background: var(--paper);
    padding: 20px 48px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--rule); z-index: 100;
  }
  .nav-logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }

  header { padding: 80px 48px; text-align: center; max-width: 900px; margin: 0 auto; }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(40px, 8vw, 72px); line-height: 1; margin-bottom: 24px; }
  .header-desc { color: var(--muted); font-size: 18px; font-family: 'Syne', sans-serif; }

  .post-container { max-width: 800px; margin: 0 auto; padding: 0 24px 120px; }
  
  .post-meta { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; display: block; }
  .post-title { font-family: 'DM Serif Display', serif; font-size: clamp(32px, 5vw, 48px); line-height: 1.1; margin-bottom: 32px; }
  
  .post-content { margin: 48px 0; }
  .post-content h2 { font-family: 'Syne', sans-serif; font-size: 24px; margin: 48px 0 24px; color: var(--ink); }
  .post-content h3 { font-family: 'Syne', sans-serif; font-size: 18px; margin: 32px 0 16px; color: var(--ink); }
  .post-content p { margin-bottom: 24px; color: var(--ink); opacity: 0.9; }
  .post-content ul, .post-content ol { margin: 24px 0 24px 32px; }
  .post-content li { margin-bottom: 12px; }
  .post-content code { background: rgba(10,14,20,0.05); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  .post-content pre { background: var(--card); padding: 24px; border-radius: 8px; overflow-x: auto; margin: 24px 0; }
  .post-content pre code { background: none; padding: 0; }
  
  .post-navigation { display: flex; justify-content: space-between; align-items: center; margin: 80px 0 48px; padding-top: 48px; border-top: 1px solid var(--rule); }
  .post-nav-link { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
  .post-nav-link:hover { text-decoration: underline; }
  .post-nav-prev { flex-direction: row-reverse; }

  .post-share { background: var(--card); padding: 24px; border-radius: 8px; text-align: center; margin: 48px 0; }
  .post-share p { margin-bottom: 16px; font-size: 13px; }
  .share-buttons { display: flex; justify-content: center; gap: 12px; }
  .share-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--paper); text-decoration: none; transition: transform 0.2s; }
  .share-btn:hover { transform: scale(1.1); }

  footer { padding: 48px; border-top: 1px solid var(--rule); text-align: center; color: var(--muted); font-size: 12px; }

  @media (max-width: 768px) {
    nav { padding: 12px 16px; flex-wrap: wrap; }
    .nav-logo { flex: 1; }
    .theme-toggle { margin-left: auto; }
    .nav-links { order: 3; width: 100%; overflow-x: auto; padding: 8px 0; gap: 20px; }
    header { padding: 60px 24px; }
    .post-container { padding-bottom: 80px; }
    .post-navigation { flex-direction: column; gap: 24px; }
  }

  @media (max-width: 480px) {
    header { padding: 48px 20px; }
    h1 { font-size: 36px; }
    .post-title { font-size: 28px; }
    .post-content h2 { font-size: 20px; }
    .post-container { padding: 0 16px 80px; }
    nav { padding: 12px; }
  }
</style>
<!-- Google Analytics -->

</head>
<body>

<nav>
  <a href="../index/" class="nav-logo">Victor Kipruto Rop</a>
  <div class="nav-links">
    <a href="../index/">Home</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#blog">Blog</a>
    <a href="index.html#send-message">Contact</a>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">
    <i class="fas fa-moon"></i>
    <i class="fas fa-sun"></i>
  </button>
</nav>

<header>
  <span class="post-meta" id="post-meta">Loading...</span>
  <h1 id="post-title">Loading Post...</h1>
</header>

<main class="post-container">
  <article id="post-content">
    <p>Loading content...</p>
  </article>

  <div class="post-share">
    <p>Found this helpful? Share with your network</p>
    <div class="share-buttons">
      <a class="share-btn" href="#" title="Share on Twitter" aria-label="Share on Twitter" data-platform="twitter">
        <i class="fab fa-twitter"></i>
      </a>
      <a class="share-btn" href="#" title="Share on LinkedIn" aria-label="Share on LinkedIn" data-platform="linkedin">
        <i class="fab fa-linkedin"></i>
      </a>
      <a class="share-btn" href="#" title="Share on WhatsApp" aria-label="Share on WhatsApp" data-platform="whatsapp">
        <i class="fab fa-whatsapp"></i>
      </a>
      <a class="share-btn" href="#" title="Share on Discord" aria-label="Share on Discord" data-platform="discord">
        <i class="fab fa-discord"></i>
      </a>
      <a class="share-btn" href="#" title="Share on GitHub" aria-label="Share on GitHub" data-platform="github">
        <i class="fab fa-github"></i>
      </a>
      <a class="share-btn" href="#" title="Copy Link" aria-label="Copy Link" data-platform="copy">
        <i class="fas fa-link"></i>
      </a>
    </div>
  </div>

  <div class="post-navigation">
    <a class="post-nav-link post-nav-prev" href="../blog/">
      <i class="fas fa-arrow-left"></i>
      <span>Back to Blog</span>
    </a>
    <a class="post-nav-link" href="index.html#projects">
      <span>See Projects</span>
      <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</main>

<footer>
  <p>© 2026 Victor Kipruto Rop · Built with focus on data integrity and clear communication.</p>
</footer>

<script src="assets/shared/posts.js"></script>
<script>
  // Load post data based on URL parameter
  async function initPost() {
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id') || 'first-post';
    
    // Try to load autogenerated posts if not in window.posts
    if (!window.posts || !window.posts[postId]) {
      try {
        const response = await fetch('blog/assets/shared/posts.json');
        if (response.ok) {
          const autoPosts = await response.json();
          if (Array.isArray(autoPosts)) {
            autoPosts.forEach(post => {
              const id = post.slug || post.id;
              if (!window.posts[id]) {
                const pubDate = new Date(post.publishDate);
                window.posts[id] = {
                  title: post.title,
                  date: pubDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
                  readTime: post.readTime || 10,
                  excerpt: post.description || post.excerpt,
                  content: post.content_html || `<p>${post.description}</p><p>Full content coming soon...</p>`
                };
              }
            });
          }
        }
      } catch (e) {
        console.error('Error loading autogenerated posts:', e);
      }
    }

    if (window.posts && window.posts[postId]) {
      const post = window.posts[postId];
      document.getElementById('page-title').textContent = post.title + ' — Victor Kipruto Rop';
      document.getElementById('page-desc').textContent = post.excerpt;
      document.getElementById('post-meta').textContent = post.date + ' · ' + post.readTime + ' min read';
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-content').innerHTML = post.content;
    } else {
      // Handle post not found
      document.getElementById('post-title').textContent = 'Article Not Found';
      document.getElementById('post-meta').textContent = 'Error 404';
      document.getElementById('post-content').innerHTML = `
        <div style="text-align: center; padding: 48px 0;">
          <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: var(--accent); margin-bottom: 24px;"></i>
          <p>Sorry, the article you're looking for doesn't exist or has been moved.</p>
          <a href="../blog/" class="back-link" style="margin-top: 24px; display: inline-flex;"><i class="fas fa-arrow-left"></i> Back to Blog</a>
        </div>
      `;
    }
  }

  initPost();

  // Theme toggle
  const themeToggle = document.getElementById('theme-toggle');
  const savedTheme = localStorage.getItem('theme');
  
  if (savedTheme === 'light') {
    document.body.classList.remove('dark-mode');
  } else {
    document.body.classList.add('dark-mode');
    localStorage.setItem('theme', 'dark');
  }

  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDarkMode = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
  });

  // Share buttons
  document.querySelectorAll('.share-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      
      const platform = btn.dataset.platform;
      const title = encodeURIComponent(document.querySelector('#post-title')?.textContent || 'Check this out!');
      const url = encodeURIComponent(window.location.href);
      const pageTitle = encodeURIComponent(document.title);
      let shareUrl = '';
      
      switch(platform) {
        case 'twitter':
          shareUrl = `https://twitter.com/intent/tweet?url=${url}&text=${pageTitle}`;
          break;
        case 'linkedin':
          shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
          break;
        case 'whatsapp':
          shareUrl = `https://wa.me/?text=${pageTitle}%20${url}`;
          break;
        case 'discord':
          // Discord doesn't have a direct share URL, but users can paste the link
          shareUrl = `https://discord.com/channels/@me`;
          break;
        case 'github':
          // Link to user's GitHub profile
          shareUrl = 'https://github.com/Victor-Kipruto-Rop';
          break;
        case 'copy':
          // Copy link to clipboard
          navigator.clipboard.writeText(window.location.href).then(() => {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i>';
            btn.title = 'Copied!';
            setTimeout(() => {
              btn.innerHTML = originalText;
              btn.title = 'Copy Link';
            }, 2000);
          }).catch(() => {
            alert('Failed to copy link');
          });
          return;
      }
      
      if (shareUrl) window.open(shareUrl, '_blank', 'width=600,height=400');
    });
  });
</script>
</body>
