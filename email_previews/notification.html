
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Security Update</title>
      <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100%;
    }
    .email-wrapper {
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .email-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 50px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .email-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .email-header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      position: relative;
      z-index: 1;
      letter-spacing: -0.5px;
    }
    .email-header .subtitle {
      font-size: 14px;
      opacity: 0.95;
      margin-top: 8px;
      position: relative;
      z-index: 1;
      font-weight: 300;
    }
    .email-content {
      padding: 40px 30px;
    }
    .email-section {
      margin-bottom: 30px;
    }
    .email-section h2 {
      color: #2d3748;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 16px;
      font-weight: 700;
      position: relative;
      padding-bottom: 10px;
    }
    .email-section h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
    }
    .email-section p {
      color: #4a5568;
      margin: 14px 0;
      font-size: 15px;
      line-height: 1.7;
    }
    .email-section ul, .email-section ol {
      margin: 16px 0 16px 20px;
      color: #4a5568;
    }
    .email-section li {
      margin: 10px 0;
      font-size: 15px;
      line-height: 1.6;
    }
    .email-section a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 2px solid #667eea;
      transition: all 0.3s ease;
    }
    .email-section a:hover {
      color: #764ba2;
      border-bottom-color: #764ba2;
    }
    .cta-button {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white !important;
      text-decoration: none !important;
      border-radius: 8px;
      font-weight: 700;
      margin: 16px 0;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      border: none;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 0.3px;
      border-bottom: none !important;
    }
    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }
    .secondary-button {
      display: inline-block;
      padding: 12px 28px;
      background: #f0f4ff;
      color: #667eea !important;
      text-decoration: none !important;
      border-radius: 8px;
      font-weight: 600;
      margin: 12px 8px 12px 0;
      transition: all 0.3s ease;
      font-size: 14px;
      border: 2px solid #667eea;
      border-bottom: 2px solid #667eea;
    }
    .secondary-button:hover {
      background: #667eea;
      color: white !important;
    }
    .highlight-box {
      background: linear-gradient(135deg, #f5f7ff 0%, #e0e7ff 100%);
      border-left: 5px solid #667eea;
      padding: 20px 20px;
      margin: 24px 0;
      border-radius: 8px;
      border-left-width: 5px;
    }
    .highlight-box strong {
      color: #2d3748;
      font-weight: 700;
    }
    .info-box {
      background: linear-gradient(135deg, #fffaf0 0%, #fef3c7 100%);
      border-left: 5px solid #f59e0b;
      padding: 20px;
      margin: 24px 0;
      border-radius: 8px;
    }
    .success-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-left: 5px solid #10b981;
      padding: 20px;
      margin: 24px 0;
      border-radius: 8px;
    }
    .stat-box {
      background: linear-gradient(135deg, #f8f9fa 0%, #f1f3f5 100%);
      border: 2px solid #e9ecef;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      margin: 16px 0;
      transition: all 0.3s ease;
    }
    .stat-box:hover {
      border-color: #667eea;
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }
    .stat-number {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0;
    }
    .stat-label {
      color: #718096;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
      margin: 32px 0;
    }
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }
    .grid-item {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }
    .grid-item h3 {
      color: #2d3748;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .grid-item p {
      color: #4a5568;
      font-size: 13px;
      margin: 0;
    }
    .email-footer {
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      padding: 40px 30px;
      text-align: center;
      color: #cbd5e0;
      font-size: 12px;
    }
    .footer-links {
      margin: 20px 0;
    }
    .footer-links a {
      color: #a0aec0;
      text-decoration: none;
      margin: 0 12px;
      font-weight: 500;
      transition: color 0.3s ease;
      border-bottom: none !important;
    }
    .footer-links a:hover {
      color: #f5a623;
    }
    .unsubscribe-notice {
      color: #a0aec0;
      font-size: 11px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #4a5568;
    }
    .unsubscribe-notice a {
      color: #f5a623;
      text-decoration: none;
      border-bottom: none !important;
    }
    .unsubscribe-notice a:hover {
      text-decoration: underline;
    }
    .tag {
      display: inline-block;
      background: linear-gradient(135deg, #e0e7ff 0%, #dbeafe 100%);
      color: #3730a3;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin: 6px 6px 6px 0;
      border: 1px solid #c7d2fe;
    }
    .tag.hot {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #7f1d1d;
      border-color: #fca5a5;
    }
    .tag.featured {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      color: #78350f;
      border-color: #fcd34d;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .social-links {
      margin: 20px 0;
      text-align: center;
    }
    .social-icon {
      display: inline-block;
      width: 36px;
      height: 36px;
      margin: 0 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      text-align: center;
      line-height: 36px;
      color: white;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
      border-bottom: none !important;
    }
    .social-icon:hover {
      transform: scale(1.1) translateY(-3px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
    }
    .feature-list {
      list-style: none;
      margin: 20px 0;
    }
    .feature-list li {
      padding: 12px 0;
      padding-left: 28px;
      position: relative;
      color: #4a5568;
    }
    .feature-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #10b981;
      font-weight: 700;
      font-size: 18px;
    }
    .image-card {
      margin: 24px 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .image-card img {
      width: 100%;
      display: block;
      max-height: 350px;
      object-fit: cover;
    }
    @media (max-width: 600px) {
      .email-container {
        border-radius: 8px;
      }
      .content-grid {
        grid-template-columns: 1fr;
      }
      .email-header h1 {
        font-size: 24px;
      }
      .email-content {
        padding: 24px 16px;
      }
    }
    </style>
    </head>
    <body>
      <div class="email-wrapper">
        <div class="email-container">
          <div class="email-header">
            <h1>🔒 Security Update</h1>
          </div>
          
          <div class="email-content">

            <div class="highlight-box">
              <strong>Need help?</strong> Reply to this email or visit my <a href="https://victor-kipruto-rop.github.io/victor-resum-web/">portfolio</a>.

          </div>
          
          <div class="email-footer">
            <p><strong>Victor Kipruto Rop</strong> | Data Engineer & Full Stack Developer</p>
            <div class="footer-links">
              <a href="https://victor-kipruto-rop.github.io/victor-resum-web/">Portfolio</a>
              <a href="https://github.com/kipruto45">GitHub</a>
            </div>
            <p class="unsubscribe-notice">
              © 2024 Victor Kipruto. All rights reserved.<br>

            </p>
          </div>
        </div>
      </div>
    </body>
    </html>
