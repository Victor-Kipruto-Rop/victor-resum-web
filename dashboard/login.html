<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBOS Dashboard Login - Private</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ink:    #0a0e14;
            --paper:  #f5f0e8;
            --accent: #c8401a;
            --muted:  #7a7060;
            --rule:   #d4cec2;
        }
        
        body.dark-mode {
            --ink:    #f5f0e8;
            --paper:  #0a0e14;
            --accent: #ff4b2b;
            --muted:  #a1a1aa;
            --rule:   #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(200, 64, 26, 0.1);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--rule);
            color: var(--ink);
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .theme-toggle .fa-sun { display: none; }
        body.dark-mode .theme-toggle .fa-moon { display: none; }
        body.dark-mode .theme-toggle .fa-sun { display: block; }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            text-align: center;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 8px;
            color: var(--ink);
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--rule);
            box-shadow: 0 0 20px rgba(200, 64, 26, 0.2);
        }

        input::placeholder {
            color: var(--muted);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--paper);
            border: none;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-login:hover {
            background: var(--ink);
            color: var(--paper);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(200, 64, 26, 0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: flex;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #bbf7d0;
            display: flex;
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 30px;
            line-height: 1.6;
        }

        .footer-text a {
            color: #9370db;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .demo-note {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #fed7aa;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
    <meta name="robots" content="noindex, nofollow">
    <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-D3BGPZ2LCR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-D3BGPZ2LCR');
</script>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" style="position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--rule); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 14px;">
        <i class="fas fa-moon"></i>
        <i class="fas fa-sun"></i>
    </button>
  <!-- Navigation -->
  <nav style="position: sticky; top: 0; background: var(--paper); padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); z-index: 100;">
    <a href="../index.html" style="font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); text-decoration: none; font-weight: 600;">Victor Kipruto Rop</a>
    <div style="display: flex; gap: 32px; align-items: center;">
      <a href="../blog.html" style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-decoration: none;">Blog</a>
      <a href="../index.html" style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-decoration: none;">Home</a>
    </div>
  </nav>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-lock"></i>
            <h1>DBOS Access</h1>
            <div class="subtitle"><span class="status-indicator"></span>System Online</div>
        </div>

        <div class="alert error" id="errorAlert"></div>
        <div class="alert success" id="successAlert"></div>

        <div class="demo-note">
            <i class="fas fa-info-circle"></i> Demo Credentials:
            <br>Email: admin@dbos.local
            <br>Password: demo123
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" style="margin-bottom: 0;">Keep me logged in</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="footer-text">
            <p>🔐 Private Dashboard</p>
            <p>Only accessible with valid credentials</p>
            <p>Session expires after 8 hours of inactivity</p>
        </div>
    </div>

    <script>
        // Demo credentials (in production, validate against backend)
        const DEMO_CREDENTIALS = {
            email: 'admin@dbos.local',
            password: 'demo123'
        };

        // Generate demo token
        function generateToken() {
            const timestamp = Date.now();
            const random = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${random}`;
        }

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('loginBtn');

            // Clear alerts
            hideAlerts();

            // Validate
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            // Simulate API call
            setTimeout(() => {
                // Demo validation
                if (email === DEMO_CREDENTIALS.email && password === DEMO_CREDENTIALS.password) {
                    const token = generateToken();
                    const expiryTime = remember ? Date.now() + (30 * 24 * 60 * 60 * 1000) : Date.now() + (8 * 60 * 60 * 1000);
                    
                    localStorage.setItem('dbos_dashboard_token', token);
                    localStorage.setItem('dbos_user_email', email);
                    localStorage.setItem('dbos_session_expiry', expiryTime);

                    showAlert('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/victor-resum-web/dashboard/analytics-dashboard-private.html';
                    }, 1000);
                } else {
                    showAlert('Invalid email or password', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }
            }, 1500);
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById(`${type}Alert`);
            alertBox.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
        }

        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }

        // Auto-fill demo credentials for demo purposes
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('demo') === 'true') {
                document.getElementById('email').value = DEMO_CREDENTIALS.email;
                document.getElementById('password').value = DEMO_CREDENTIALS.password;
                document.getElementById('remember').checked = true;
            }
        });

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('dbos_dashboard_token');
            const expiry = localStorage.getItem('dbos_session_expiry');
            
            if (token && expiry && Date.now() < parseInt(expiry)) {
                window.location.href = '/victor-resum-web/dashboard/analytics-dashboard-private.html';
            }
        });
    </script>

    <script>
        // Theme Toggle Logic
        const themeToggle = document.querySelector('[id*="theme-toggle"], [id*="themeToggle"]');
        const body = document.body;
        
        if (themeToggle) {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
            }
            
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
                localStorage.setItem('theme', theme);
            });
        }
    </script>
</body>
</html>
