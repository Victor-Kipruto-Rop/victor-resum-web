<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #252d3d;
      --text-primary: #e8eef5;
      --text-secondary: #b0c1d9;
      --text-muted: #7a8fa6;
      --accent-primary: #ff4b2b;
      --accent-secondary: #3b82f6;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --border-color: rgba(200, 213, 219, 0.2);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    body {
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── LOGIN SCREEN ─── */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a2332 100%);
      padding: 20px;
    }

    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 60px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      font-size: 48px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .form-group input {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
      background: rgba(255, 75, 43, 0.05);
      box-shadow: 0 0 0 3px rgba(255, 75, 43, 0.1);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      background: linear-gradient(135deg, var(--accent-primary), #ff6d3b);
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 75, 43, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--accent-danger);
      border-radius: 8px;
      padding: 12px;
      color: #fca5a5;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-error.show {
      display: flex;
    }

    .login-loading {
      text-align: center;
      color: var(--text-muted);
      display: none;
    }

    .login-loading.show {
      display: block;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 75, 43, 0.2);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── HUB SCREEN ─── */
    .hub-container {
      display: none;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .hub-container.active {
      display: block;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .hub-header {
      max-width: 1400px;
      margin: 0 auto 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .hub-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hub-title h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 40px;
      font-weight: 600;
      margin: 0;
    }

    .hub-title-badge {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hub-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .session-info {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .session-timer {
      color: var(--accent-warning);
      font-weight: 600;
      font-family: 'DM Mono', monospace;
    }

    .logout-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 20px;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn:hover {
      background: var(--accent-danger);
      border-color: var(--accent-danger);
      color: white;
    }

    /* ─── DASHBOARD GRID ─── */
    .dashboards-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .dashboard-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px 24px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .dashboard-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .dashboard-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-8px);
      box-shadow: var(--shadow);
    }

    .dashboard-card:hover::before {
      opacity: 1;
    }

    .dashboard-icon {
      font-size: 40px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dashboard-name {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .dashboard-desc {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .dashboard-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .dashboard-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .dashboard-button {
      background: var(--accent-primary);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      color: white;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dashboard-button:hover {
      background: #ff6d3b;
      transform: scale(1.05);
    }

    /* ─── CREDENTIALS MODAL ─── */
    .credentials-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
    }

    .credentials-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: modalSlideIn 0.3s ease-out;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .modal-header p {
      color: var(--text-muted);
      font-size: 13px;
    }

    .credential-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .credential-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .credential-label-text {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .credential-value {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--accent-primary);
      word-break: break-all;
    }

    .copy-btn {
      background: var(--accent-secondary);
      border: none;
      border-radius: 6px;
      padding: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: #2563eb;
      transform: scale(1.1);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 12px;
    }

    .modal-btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), #ff6d3b);
      color: white;
    }

    .modal-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(255, 75, 43, 0.3);
    }

    .modal-btn-secondary {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .modal-btn-secondary:hover {
      background: var(--accent-danger);
      border-color: var(--accent-danger);
      color: white;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .login-card {
        padding: 40px 24px;
      }

      .hub-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .hub-title h1 {
        font-size: 28px;
      }

      .hub-controls {
        width: 100%;
        flex-direction: column;
      }

      .dashboards-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 24px;
      }

      .hub-header {
        margin-bottom: 40px;
      }
    }

    /* ─── TOAST NOTIFICATIONS ─── */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 24px;
      color: var(--text-primary);
      font-size: 14px;
      z-index: 2000;
      animation: slideInRight 0.3s ease-out;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.success {
      border-color: var(--accent-success);
      background: rgba(16, 185, 129, 0.1);
      color: #86efac;
    }

    .toast.error {
      border-color: var(--accent-danger);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <!-- ═════════════════════════════════════════ LOGIN SCREEN ═════════════════════════════════════════ -->
  <div class="login-container" id="loginScreen">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><i class="fas fa-chart-line"></i></div>
        <h1>Dashboard Hub</h1>
        <p>Access all your analytics in one place</p>
      </div>

      <div class="login-form">
        <div class="login-error" id="loginError">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMessage"></span>
        </div>

        <div class="login-loading" id="loginLoading">
          <div class="spinner"></div>
          <p>Authenticating...</p>
        </div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="form-group">
            <label for="password">Master Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="login-button">
            <i class="fas fa-lock"></i> Access Dashboard Hub
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═════════════════════════════════════════ HUB SCREEN ═════════════════════════════════════════ -->
  <div class="hub-container" id="hubScreen">
    <div class="hub-header">
      <div class="hub-title">
        <div>
          <h1>Dashboard Hub</h1>
          <span class="hub-title-badge">v1.0</span>
        </div>
      </div>
      <div class="hub-controls">
        <div class="session-info">
          <i class="fas fa-clock"></i>
          <span>Session expires in:</span>
          <span class="session-timer" id="sessionTimer">8:00</span>
        </div>
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <div class="dashboards-grid" id="dashboardsGrid"></div>
  </div>

  <!-- ═════════════════════════════════════════ CREDENTIALS MODAL ═════════════════════════════════════════ -->
  <div class="credentials-modal" id="credentialsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Dashboard Credentials</h2>
        <p id="modalDesc">Copy the access token below to authenticate</p>
      </div>
      <div id="credentialsList"></div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-primary" onclick="redirectToDashboard()">
          <i class="fas fa-arrow-right"></i> Open Dashboard
        </button>
        <button class="modal-btn modal-btn-secondary" onclick="closeCredentialsModal()">
          <i class="fas fa-times"></i> Close
        </button>
      </div>
    </div>
  </div>

  <script>
    // ═════════════════════════════════════════ CONFIGURATION ═════════════════════════════════════════
    const CONFIG = {
      HUB_PASSWORD: 'Victor@Hub2026Secure!',
      SESSION_TIMEOUT: 8 * 60 * 60 * 1000, // 8 hours
      SESSION_KEY: 'dashboard_hub_session',
      DASHBOARDS: [
        {
          id: 'operations',
          name: 'Blog Operations',
          icon: 'fas fa-chart-bar',
          desc: 'Complete analytics, content tracking, SEO, and AI-powered recommendations',
          url: 'blog-operations-center.html',
          password: 'victor_blog_ops_2024',
          status: 'Operational'
        },
        {
          id: 'main',
          name: 'Main Dashboard',
          icon: 'fas fa-tachometer-alt',
          desc: 'Core analytics and visitor tracking for your portfolio',
          url: 'index.html',
          password: 'main_dash_2024',
          status: 'Operational'
        },
        {
          id: 'enhanced',
          name: 'Enhanced Dashboard',
          icon: 'fas fa-star',
          desc: 'Advanced analytics with enhanced visualizations',
          url: 'index-enhanced.html',
          password: 'enhanced_dash_2024',
          status: 'Operational'
        },
        {
          id: 'saas',
          name: 'SaaS Dashboard',
          icon: 'fas fa-rocket',
          desc: 'Modern SaaS-style interface for analytics',
          url: 'index-saas.html',
          password: 'saas_dash_2024',
          status: 'Operational'
        },
        {
          id: 'themed',
          name: 'Themed Dashboard',
          icon: 'fas fa-palette',
          desc: 'Customizable themed analytics dashboard',
          url: 'index-themed.html',
          password: 'themed_dash_2024',
          status: 'Operational'
        }
      ]
    };

    let currentDashboard = null;

    // ═════════════════════════════════════════ INITIALIZATION ═════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', handleLogin);

      // Check if already authenticated
      const session = localStorage.getItem(CONFIG.SESSION_KEY);
      if (session) {
        const sessionData = JSON.parse(session);
        if (Date.now() - sessionData.timestamp < CONFIG.SESSION_TIMEOUT) {
          showHub();
        } else {
          localStorage.removeItem(CONFIG.SESSION_KEY);
        }
      }

      // Setup session timer
      startSessionTimer();
    });

    // ═════════════════════════════════════════ AUTHENTICATION ═════════════════════════════════════════
    function handleLogin(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const loadingDiv = document.getElementById('loginLoading');
      const form = document.getElementById('loginForm');

      errorDiv.classList.remove('show');
      form.style.display = 'none';
      loadingDiv.classList.add('show');

      // Simulate authentication delay
      setTimeout(() => {
        if (password === CONFIG.HUB_PASSWORD) {
          const sessionData = {
            authenticated: true,
            timestamp: Date.now()
          };
          localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(sessionData));
          showHub();
        } else {
          document.getElementById('errorMessage').textContent = 'Invalid password. Please try again.';
          errorDiv.classList.add('show');
          form.style.display = 'flex';
          loadingDiv.classList.remove('show');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 600);
    }

    function showHub() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('hubScreen').classList.add('active');
      renderDashboards();
      startSessionTimer();
    }

    function logout() {
      localStorage.removeItem(CONFIG.SESSION_KEY);
      closeCredentialsModal();
      document.getElementById('hubScreen').classList.remove('active');
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      showToast('Logged out successfully', 'success');
    }

    // ═════════════════════════════════════════ DASHBOARD RENDERING ═════════════════════════════════════════
    function renderDashboards() {
      const grid = document.getElementById('dashboardsGrid');
      grid.innerHTML = '';

      CONFIG.DASHBOARDS.forEach(dashboard => {
        const card = document.createElement('div');
        card.className = 'dashboard-card';
        card.innerHTML = `
          <div class="dashboard-icon"><i class="${dashboard.icon}"></i></div>
          <div class="dashboard-name">${dashboard.name}</div>
          <div class="dashboard-desc">${dashboard.desc}</div>
          <div class="dashboard-footer">
            <div class="dashboard-status">
              <span class="status-dot"></span>
              <span>${dashboard.status}</span>
            </div>
            <button class="dashboard-button" onclick="showCredentials('${dashboard.id}')">
              <i class="fas fa-unlock"></i> Access
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ═════════════════════════════════════════ CREDENTIALS MODAL ═════════════════════════════════════════
    function showCredentials(dashboardId) {
      const dashboard = CONFIG.DASHBOARDS.find(d => d.id === dashboardId);
      if (!dashboard) return;

      currentDashboard = dashboard;
      const modal = document.getElementById('credentialsModal');
      document.getElementById('modalTitle').textContent = `${dashboard.name} Access`;
      document.getElementById('modalDesc').textContent = `Copy your access token and open ${dashboard.name}`;

      const credentialsList = document.getElementById('credentialsList');
      credentialsList.innerHTML = `
        <div class="credential-item">
          <div class="credential-label">
            <span class="credential-label-text">Access Token</span>
            <div class="credential-value">${dashboard.password}</div>
          </div>
          <button class="copy-btn" onclick="copyToClipboard('${dashboard.password}')">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      `;

      modal.classList.add('active');
    }

    function closeCredentialsModal() {
      document.getElementById('credentialsModal').classList.remove('active');
      currentDashboard = null;
    }

    function redirectToDashboard() {
      if (currentDashboard) {
        window.open(currentDashboard.url, '_blank');
        showToast(`Opening ${currentDashboard.name}...`, 'success');
        closeCredentialsModal();
      }
    }

    // ═════════════════════════════════════════ UTILITIES ═════════════════════════════════════════
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Access token copied to clipboard!', 'success');
      }).catch(() => {
        showToast('Failed to copy to clipboard', 'error');
      });
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
        <span>${message}</span>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideOutRight 0.3s ease-out';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function startSessionTimer() {
      const updateTimer = () => {
        const session = localStorage.getItem(CONFIG.SESSION_KEY);
        if (!session) {
          logout();
          return;
        }

        const sessionData = JSON.parse(session);
        const elapsed = Date.now() - sessionData.timestamp;
        const remaining = CONFIG.SESSION_TIMEOUT - elapsed;

        if (remaining <= 0) {
          logout();
          return;
        }

        const hours = Math.floor(remaining / (60 * 60 * 1000));
        const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
        const seconds = Math.floor((remaining % (60 * 1000)) / 1000);

        const timerElement = document.getElementById('sessionTimer');
        if (timerElement) {
          timerElement.textContent = `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
      };

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    // Close modal on outside click
    document.getElementById('credentialsModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('credentialsModal')) {
        closeCredentialsModal();
      }
    });
  </script>
</body>
</html>
