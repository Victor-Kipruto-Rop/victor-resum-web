<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBOS Image Library | Auto Image Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink:    #0a0e14;
            --paper:  #f5f0e8;
            --accent: #c8401a;
            --muted:  #7a7060;
            --rule:   #d4cec2;
        }
        
        body.dark-mode {
            --ink:    #f5f0e8;
            --paper:  #0a0e14;
            --accent: #ff4b2b;
            --muted:  #a1a1aa;
            --rule:   #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: transparent;
            padding: 30px 0;
            border-radius: 0;
            margin-bottom: 30px;
            box-shadow: none;
            border-bottom: 1px solid var(--rule);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--ink);
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--rule);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--rule);
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 8px;
            color: var(--ink);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--rule);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--ink);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .image-card {
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .image-card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(200, 64, 26, 0.1);
            transform: translateY(-5px);
        }

        .image-preview {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, var(--accent) 0%, rgba(200, 64, 26, 0.6) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--paper);
            font-size: 48px;
        }

        .image-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .image-name {
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 5px;
        }

        .image-category {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(200, 64, 26, 0.1);
            border-radius: 4px;
            font-size: 10px;
            color: var(--muted);
        }

        .assignment-item {
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .assignment-thumbnail {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent) 0%, rgba(200, 64, 26, 0.6) 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--paper);
            font-size: 32px;
        }

        .assignment-title {
            font-weight: 600;
            color: var(--ink);
        }

        .assignment-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--muted);
        }

        .assignment-image {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(200, 64, 26, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(200, 64, 26, 0.3);
        }

        .stat-box {
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .image-preview {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .image-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .image-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .image-category {
            font-size: 12px;
            color: var(--info);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .image-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .tag {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(147, 112, 219, 0.2);
            border-radius: 4px;
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Posts Assignment */
        .assignment-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .assignment-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .assignment-thumbnail {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        .assignment-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .assignment-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .assignment-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .assignment-image {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(46, 204, 113, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .assignment-image i {
            color: var(--success);
        }

        /* Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        /* Category Breakdown */
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .category-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }

        .category-count {
            background: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .category-images {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-image-tag {
            background: rgba(147, 112, 219, 0.1);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .library-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .assignment-item {
                grid-template-columns: 60px 1fr;
            }

            .assignment-image {
                grid-column: 1 / -1;
            }
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 15px;
        }
    </style>

<body>
    <!-- Navigation -->
    <nav style="position: sticky; top: 0; background: var(--paper); padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); z-index: 100;">
        <a href="../index.html" style="font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); text-decoration: none; font-weight: 600;">Victor Kipruto Rop</a>
        <div style="display: flex; gap: 32px; align-items: center;">
            <a href="../blog.html" style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-decoration: none;">Blog</a>
            <a href="../index.html" style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-decoration: none;">Home</a>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" style="background: transparent; border: 1px solid var(--rule); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 14px; margin-left: 0;">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
            </button>
        </div>
    </nav>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-image"></i>
                Image Library Manager
            </h1>
            <div class="header-stats">
                <div class="stat-card">
                    <div class="stat-label">Total Images</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Categories</div>
                    <div class="stat-value" id="stat-categories">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Posts Assigned</div>
                    <div class="stat-value" id="stat-posts">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Coverage</div>
                    <div class="stat-value" id="stat-coverage">0%</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('library')">
                <i class="fas fa-images"></i> Library
            </button>
            <button class="tab-btn" onclick="switchTab('assignments')">
                <i class="fas fa-list"></i> Assignments
            </button>
            <button class="tab-btn" onclick="switchTab('categories')">
                <i class="fas fa-folder"></i> Categories
            </button>
            <button class="tab-btn" onclick="switchTab('statistics')">
                <i class="fas fa-chart-bar"></i> Statistics
            </button>
        </div>

        <!-- Library Tab -->
        <div id="library" class="tab-content active">
            <div class="actions">
                <button class="btn btn-primary" onclick="loadLibrary()">
                    <i class="fas fa-sync"></i> Refresh Library
                </button>
            </div>
            <div class="library-grid" id="library-grid">
                <div class="empty">
                    <i class="fas fa-spinner"></i>
                    <p>Loading image library...</p>
                </div>
            </div>
        </div>

        <!-- Assignments Tab -->
        <div id="assignments" class="tab-content">
            <div class="actions">
                <button class="btn btn-primary" onclick="loadAssignments()">
                    <i class="fas fa-sync"></i> Refresh Assignments
                </button>
            </div>
            <div class="assignment-list" id="assignment-list">
                <div class="empty">
                    <i class="fas fa-spinner"></i>
                    <p>Loading assignments...</p>
                </div>
            </div>
        </div>

        <!-- Categories Tab -->
        <div id="categories" class="tab-content">
            <div class="category-list" id="category-list">
                <div class="empty">
                    <i class="fas fa-spinner"></i>
                    <p>Loading categories...</p>
                </div>
            </div>
        </div>

        <!-- Statistics Tab -->
        <div id="statistics" class="tab-content">
            <div class="stats-grid" id="stats-grid">
                <div class="empty">
                    <i class="fas fa-spinner"></i>
                    <p>Loading statistics...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data
        let libraryData = null;
        let assignmentData = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadLibrary();
            loadAssignments();
        });

        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.closest('.tab-btn').classList.add('active');

            // Load data for tab
            if (tabName === 'statistics') {
                loadStatistics();
            } else if (tabName === 'categories') {
                loadCategories();
            }
        }

        // Load library
        async function loadLibrary() {
            try {
                // In production, load from /assets/auto/library-config.json
                libraryData = getSampleLibrary();
                renderLibrary();
                updateStats();
            } catch (error) {
                console.error('Failed to load library:', error);
            }
        }

        // Render library
        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            
            if (!libraryData || !libraryData.assets) {
                grid.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>No images in library</p></div>';
                return;
            }

            grid.innerHTML = Object.entries(libraryData.assets).map(([name, image]) => `
                <div class="image-card">
                    <div class="image-preview">
                        <i class="fas fa-image"></i>
                    </div>
                    <div class="image-info">
                        <div class="image-name">${image.name}</div>
                        <div class="image-category">${image.category}</div>
                        <div class="image-tags">
                            ${image.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load assignments
        async function loadAssignments() {
            try {
                assignmentData = getSampleAssignments();
                renderAssignments();
            } catch (error) {
                console.error('Failed to load assignments:', error);
            }
        }

        // Render assignments
        function renderAssignments() {
            const list = document.getElementById('assignment-list');
            
            if (!assignmentData || assignmentData.length === 0) {
                list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>No assignments yet</p></div>';
                return;
            }

            list.innerHTML = assignmentData.map(post => `
                <div class="assignment-item">
                    <div class="assignment-thumbnail">
                        <i class="fas fa-blog"></i>
                    </div>
                    <div class="assignment-details">
                        <div class="assignment-title">${post.title}</div>
                        <div class="assignment-meta">
                            <span><i class="fas fa-tag"></i> ${post.category}</span>
                            <span><i class="fas fa-file"></i> ${post.readTime} min read</span>
                        </div>
                    </div>
                    <div class="assignment-image">
                        <i class="fas fa-check-circle"></i>
                        <span>${post.image_name}</span>
                    </div>
                </div>
            `).join('');
        }

        // Load categories
        function loadCategories() {
            const list = document.getElementById('category-list');

            if (!libraryData || !libraryData.library) {
                list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>No categories</p></div>';
                return;
            }

            const categoryStats = {};
            Object.values(libraryData.assets).forEach(image => {
                if (!categoryStats[image.category]) {
                    categoryStats[image.category] = [];
                }
                categoryStats[image.category].push(image.name);
            });

            list.innerHTML = Object.entries(categoryStats).map(([category, images]) => `
                <div class="category-item">
                    <div class="category-header">
                        <span class="category-name">${category}</span>
                        <span class="category-count">${images.length}</span>
                    </div>
                    <div class="category-images">
                        ${images.map(name => `<span class="category-image-tag">${name}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Load statistics
        function loadStatistics() {
            const grid = document.getElementById('stats-grid');

            if (!libraryData || !libraryData.library) {
                return;
            }

            const stats = libraryData.library.stats || {};

            grid.innerHTML = `
                <div class="stat-box">
                    <h3>Total Images</h3>
                    <div class="number">${libraryData.library.total_assets || 0}</div>
                </div>
                <div class="stat-box">
                    <h3>Categories</h3>
                    <div class="number">${libraryData.library.categories.length || 0}</div>
                </div>
                <div class="stat-box">
                    <h3>Unique Tags</h3>
                    <div class="number">${libraryData.library.tags.length || 0}</div>
                </div>
                <div class="stat-box">
                    <h3>Posts Assigned</h3>
                    <div class="number">${assignmentData ? assignmentData.length : 0}</div>
                </div>
            `;
        }

        // Update header stats
        function updateStats() {
            if (!libraryData) return;

            const total = libraryData.library.total_assets || 0;
            const categories = libraryData.library.categories.length || 0;
            const posts = assignmentData ? assignmentData.length : 0;
            const coverage = posts > 0 ? Math.round((posts / 5) * 100) : 0;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-categories').textContent = categories;
            document.getElementById('stat-posts').textContent = posts;
            document.getElementById('stat-coverage').textContent = coverage + '%';
        }

        // Sample data
        function getSampleLibrary() {
            return {
                library: {
                    name: "DBOS Auto Image Library",
                    version: "1.0.0",
                    total_assets: 13,
                    categories: ["Python", "Data Engineering", "Data Transformation", "Databases", "Infrastructure", "Cloud", "AI & Machine Learning", "APIs", "Testing & QA", "Monitoring & Observability", "DevOps & Git", "Technology"],
                    tags: ["python", "data", "etl", "sql", "kubernetes", "cloud", "ai", "api", "testing", "monitoring", "git"]
                },
                assets: {
                    "python": { name: "python", category: "Python", tags: ["python", "backend"] },
                    "data-engineering": { name: "data-engineering", category: "Data Engineering", tags: ["data", "etl", "pipelines"] },
                    "airflow": { name: "airflow", category: "Data Engineering", tags: ["airflow", "orchestration"] },
                    "dbt": { name: "dbt", category: "Data Transformation", tags: ["dbt", "sql", "analytics"] },
                    "sql": { name: "sql", category: "Databases", tags: ["sql", "database"] },
                    "kubernetes": { name: "kubernetes", category: "Infrastructure", tags: ["kubernetes", "k8s"] },
                    "cloud": { name: "cloud", category: "Cloud", tags: ["cloud", "aws"] },
                    "ai-ml": { name: "ai-ml", category: "AI & Machine Learning", tags: ["ai", "ml"] },
                    "api": { name: "api", category: "APIs", tags: ["api", "rest"] },
                    "testing": { name: "testing", category: "Testing & QA", tags: ["testing", "qa"] },
                    "monitoring": { name: "monitoring", category: "Monitoring", tags: ["monitoring", "logging"] },
                    "git": { name: "git", category: "DevOps & Git", tags: ["git", "ci-cd"] },
                    "default": { name: "default", category: "Technology", tags: ["default"] }
                }
            };
        }

        function getSampleAssignments() {
            return [
                {

    <script>
        // Theme Toggle Logic
        const themeToggle = document.querySelector('[id*="theme-toggle"], [id*="themeToggle"]');
        const body = document.body;
        
        if (themeToggle) {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
            }
            
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
                localStorage.setItem('theme', theme);
            });
        }
    </script>
