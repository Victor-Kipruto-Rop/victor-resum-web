<!-- Subscription Analytics Dashboard Widget -->

<style id="analytics-dashboard-styles">
  .subscription-analytics-widget {
    background: var(--sub-bg, #ffffff);
    color: var(--sub-text, #0a0e14);
    border-radius: 12px;
    padding: 24px;
    border: 1px solid var(--sub-border, #e0e0e0);
  }

  body.dark-mode .subscription-analytics-widget {
    background: #18181b;
    color: #f5f0e8;
    border-color: #27272a;
  }

  .analytics-widget-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--sub-border, #e0e0e0);
  }

  body.dark-mode .analytics-widget-header {
    border-color: #27272a;
  }

  .analytics-widget-icon {
    font-size: 24px;
    color: #ff4b2b;
  }

  .analytics-widget-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    font-family: 'DM Serif Display', serif;
  }

  .analytics-metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .analytics-metric {
    text-align: center;
    padding: 16px;
    background: var(--sub-hover, #f5f5f5);
    border-radius: 8px;
    border: 1px solid var(--sub-border, #e0e0e0);
  }

  body.dark-mode .analytics-metric {
    background: #27272a;
    border-color: #3a3a3e;
  }

  .analytics-metric-value {
    font-size: 28px;
    font-weight: 700;
    color: #ff4b2b;
    margin-bottom: 4px;
    font-family: 'DM Mono', monospace;
  }

  .analytics-metric-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.7;
    font-weight: 600;
  }

  .analytics-chart {
    background: var(--sub-hover, #f5f5f5);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid var(--sub-border, #e0e0e0);
  }

  body.dark-mode .analytics-chart {
    background: #27272a;
    border-color: #3a3a3e;
  }

  .analytics-chart-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .analytics-bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .analytics-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .analytics-bar-label {
    min-width: 100px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .analytics-bar-container {
    flex: 1;
    height: 20px;
    background: var(--sub-border, #e0e0e0);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  body.dark-mode .analytics-bar-container {
    background: #3a3a3e;
  }

  .analytics-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff4b2b, #ff6b4b);
    transition: width 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
    font-size: 11px;
    font-weight: 600;
    color: white;
  }

  .analytics-bar-value {
    min-width: 30px;
    text-align: right;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 600;
  }

  .analytics-growth {
    background: var(--sub-hover, #f5f5f5);
    border-radius: 8px;
    padding: 16px;
    border: 1px solid var(--sub-border, #e0e0e0);
  }

  body.dark-mode .analytics-growth {
    background: #27272a;
    border-color: #3a3a3e;
  }

  .analytics-growth-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .analytics-growth-chart {
    position: relative;
    height: 100px;
    margin-bottom: 12px;
  }

  .analytics-growth-bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 100%;
    justify-content: space-around;
  }

  .analytics-growth-bar {
    flex: 1;
    background: linear-gradient(180deg, #ff4b2b, #ff6b4b);
    border-radius: 4px 4px 0 0;
    min-height: 8px;
    position: relative;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }

  .analytics-growth-bar:hover {
    opacity: 0.8;
  }

  .analytics-growth-info {
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    padding: 8px;
    background: var(--sub-bg, #ffffff);
    border-radius: 4px;
    border: 1px solid var(--sub-border, #e0e0e0);
  }

  body.dark-mode .analytics-growth-info {
    background: #18181b;
    border-color: #27272a;
  }

  .analytics-footer {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--sub-border, #e0e0e0);
    font-size: 11px;
    opacity: 0.6;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  body.dark-mode .analytics-footer {
    border-color: #27272a;
  }

  .analytics-refresh-btn {
    background: none;
    border: none;
    color: #ff4b2b;
    cursor: pointer;
    font-size: 12px;
    padding: 4px 8px;
  }

  .analytics-refresh-btn:hover {
    opacity: 0.7;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .analytics-metrics-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .analytics-metric {
      padding: 12px;
    }

    .analytics-metric-value {
      font-size: 24px;
    }

    .analytics-metric-label {
      font-size: 10px;
    }
  }
</style>

<div class="subscription-analytics-widget">
  <div class="analytics-widget-header">
    <i class="fas fa-chart-line analytics-widget-icon"></i>
    <h3 class="analytics-widget-title">Subscription Analytics</h3>
  </div>

  <!-- Key Metrics -->
  <div class="analytics-metrics-grid">
    <div class="analytics-metric">

    <div class="analytics-metric">

      <div class="analytics-metric-value" id="popularMethod">RSS</div>

    </div>
    <div class="analytics-metric">
      <div class="analytics-metric-value" id="emailCount">0</div>
      <div class="analytics-metric-label">Email Subs</div>
    </div>
  </div>

  <!-- Subscription Methods Chart -->
  <div class="analytics-chart">
    <div class="analytics-chart-title">Subscriptions by Method</div>
    <div class="analytics-bars">
      <div class="analytics-bar">
        <div class="analytics-bar-label">
          <i class="fas fa-rss" style="color: #ff4b2b;"></i>
          <span>RSS</span>

        <div class="analytics-bar-container">
          <div class="analytics-bar-fill" id="rssBar" style="width: 0%;"></div>
        </div>
        <div class="analytics-bar-value" id="rssCount">0</div>
      </div>

      <div class="analytics-bar">
        <div class="analytics-bar-label">
          <i class="fas fa-book-reader" style="color: #3498db;"></i>
          <span>Inoreader</span>
        </div>
        <div class="analytics-bar-container">
          <div class="analytics-bar-fill" id="inoreaderBar" style="width: 0%;"></div>
        </div>
        <div class="analytics-bar-value" id="inoreaderCount">0</div>
      </div>

      <div class="analytics-bar">
        <div class="analytics-bar-label">
          <i class="fas fa-layer-group" style="color: #2ecc71;"></i>
          <span>Feedly</span>
        </div>
        <div class="analytics-bar-container">
          <div class="analytics-bar-fill" id="feedlyBar" style="width: 0%;"></div>
        </div>
        <div class="analytics-bar-value" id="feedlyCount">0</div>
      </div>

      <div class="analytics-bar">
        <div class="analytics-bar-label">
          <i class="fas fa-envelope" style="color: #9b59b6;"></i>
          <span>Email</span>
        </div>
        <div class="analytics-bar-container">

  <!-- Growth Trend -->
  <div class="analytics-growth">
    <div class="analytics-growth-title">Last 7 Days Trend</div>

      <div class="analytics-growth-bars" id="growthChart"></div>
    </div>
    <div class="analytics-growth-info">
      <span>Daily Activity</span>
      <span id="growthTrend">Stable</span>

  </div>

  <!-- Footer -->
  <div class="analytics-footer">
    <span>Last updated: <span id="lastUpdated">now</span></span>
    <button class="analytics-refresh-btn" id="refreshAnalytics" title="Refresh analytics">
      <i class="fas fa-sync"></i>
    </button>
  </div>
</div>

<script id="analytics-dashboard-script">
  const analyticsDashboard = {
    updateInterval: null,

    init() {
      this.update();
      this.setupEventListeners();
      this.updateInterval = setInterval(() => this.update(), 30000); // Update every 30 seconds
    },

    setupEventListeners() {
      document.getElementById('refreshAnalytics').addEventListener('click', () => {
        this.update();
      });
    },

    update() {
      const analytics = JSON.parse(localStorage.getItem('subscriptionAnalytics') || '{}');
      const emailSubscribers = JSON.parse(localStorage.getItem('emailSubscribers') || '[]');
      const blogSubscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');

      const rss = analytics.rss_clicks || 0;
      const inoreader = analytics.inoreader_clicks || 0;
      const feedly = analytics.feedly_clicks || 0;
      const email = analytics.email_subscriptions || 0 + emailSubscribers.length;
      const telegram = analytics.telegram_subscriptions || 0;

      // Calculate totals
      const totalClicks = rss + inoreader + feedly + email + telegram;
      const totalSubscriptions = emailSubscribers.length + blogSubscribers.length;

      // Determine most popular method
      const methods = { RSS: rss, Inoreader: inoreader, Feedly: feedly, Email: email, Telegram: telegram };
      const popularMethod = Object.keys(methods).reduce((a, b) => methods[a] > methods[b] ? a : b);

      // Update metrics
      document.getElementById('totalSubscriptions').textContent = totalSubscriptions;
      document.getElementById('totalClicks').textContent = totalClicks;
      document.getElementById('popularMethod').textContent = popularMethod;
      document.getElementById('emailCount').textContent = emailSubscribers.length + blogSubscribers.length;

      // Update bars
      const max = Math.max(rss, inoreader, feedly, email, telegram, 1);
      this.updateBar('rss', rss, max);
      this.updateBar('inoreader', inoreader, max);
      this.updateBar('feedly', feedly, max);
      this.updateBar('email', email, max);
      this.updateBar('telegram', telegram, max);

      // Update counts
      document.getElementById('rssCount').textContent = rss;
      document.getElementById('inoreaderCount').textContent = inoreader;
      document.getElementById('feedlyCount').textContent = feedly;
      document.getElementById('emailSubsCount').textContent = email;
      document.getElementById('telegramCount').textContent = telegram;

      // Update growth chart
      this.updateGrowthChart();

      // Update timestamp
      const now = new Date();
      document.getElementById('lastUpdated').textContent = now.toLocaleTimeString();
    },

    updateBar(id, value, max) {
      const percentage = (value / max) * 100;
      const bar = document.getElementById(id + 'Bar');
      bar.style.width = percentage + '%';
      if (value > 0) {
        bar.textContent = value;
      }
    },

    updateGrowthChart() {
      const chart = document.getElementById('growthChart');
      chart.innerHTML = '';

      // Generate mock growth data for last 7 days
      const today = new Date();
      const days = 7;
      const heights = [];

      for (let i = 0; i < days; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - (days - 1 - i));
        const storedHeight = this.getGrowthForDate(date);
        heights.push(storedHeight);
      }

      const maxHeight = Math.max(...heights, 10);

      heights.forEach((height, index) => {
        const bar = document.createElement('div');
        bar.className = 'analytics-growth-bar';
        bar.style.height = (height / maxHeight) * 100 + '%';
        bar.title = `Day ${index + 1}: ${height} interactions`;
        chart.appendChild(bar);
      });

      // Determine trend
      const recent = heights.slice(-3).reduce((a, b) => a + b, 0) / 3;
      const previous = heights.slice(0, 4).reduce((a, b) => a + b, 0) / 4;
      const trend = recent > previous ? 'Growing' : recent < previous ? 'Declining' : 'Stable';
      document.getElementById('growthTrend').textContent = trend;
    },

    getGrowthForDate(date) {
      // Mock function - in real app would track daily
      const dateStr = date.toISOString().split('T')[0];
      const stored = localStorage.getItem('growthData_' + dateStr) || '5';
      return parseInt(stored);
    },

    destroy() {
      if (this.updateInterval) {
        clearInterval(this.updateInterval);
      }
    }
  };

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => analyticsDashboard.init());
  } else {
    analyticsDashboard.init();
  }

  // Expose for external access
  window.updateAnalyticsDashboard = () => analyticsDashboard.update();
</script>
