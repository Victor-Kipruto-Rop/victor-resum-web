name: DBOS Blog Publisher - All Phases

on:
  push:
    branches:
      - main
    paths:
      - 'blog/posts.json'
      - 'scripts/python/generate_*.py'
      - '.github/workflows/publish-blog.yml'
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-and-generate:
    runs-on: ubuntu-latest
    name: Generate All DBOS Outputs
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/python/requirements.txt ]; then pip install -r scripts/python/requirements.txt; fi
      
      # PHASE 1: Blog Engine
      - name: "Phase 1️⃣: Generate Blog Pages"
        run: python scripts/python/generate_blog.py
        continue-on-error: true
      
      # PHASE 1: RSS Feed
      - name: "Phase 1️⃣: Generate RSS Feed"
        run: python scripts/python/generate_rss.py
        continue-on-error: true
      
      # PHASE 1: Sitemap
      - name: "Phase 1️⃣: Generate Sitemap"
        run: python scripts/python/generate_sitemap.py
        continue-on-error: true
      
      # PHASE 2: SEO Engine
      - name: "Phase 2️⃣: Generate SEO Metadata"
        run: python scripts/python/generate_seo.py
        continue-on-error: true
      
      # PHASE 3: Performance Scores
      - name: "Phase 3️⃣: Generate Performance Scores"
        run: python scripts/python/generate_performance_scores.py
        continue-on-error: true
      
      # PHASE 4: Content Strategy
      - name: "Phase 4️⃣: Generate Content Strategy"
        run: python scripts/python/generate_content_strategy.py
        continue-on-error: true
      
      # PHASE 4: Distribution Plans
      - name: "Phase 4️⃣: Generate Distribution Plans"
        run: python scripts/python/generate_distribution.py
        continue-on-error: true
      
      # Commit generated files
      - name: Commit generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "DBOS Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generate DBOS outputs" && git push)
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-outputs
          path: |
            blog/rendered/
            feed.xml
            sitemap.xml
            assets/seo/
            analytics/
            strategy/
            distribution/
      
      # Send notification
      - name: Send Telegram Success Notification
        if: success()
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ DBOS Blog Publisher complete!
          📝 All phases executed
          🔗 Pages deployed" \
            -d parse_mode="HTML" || true
      
      - name: Send Telegram Failure Notification
        if: failure()
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ DBOS Blog Publisher failed. Check logs." || true
  
  deploy-pages:
    needs: publish-and-generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
      
      - name: Count generated assets
        run: |
          count=$(find assets/seo-assets -name "*.json" 2>/dev/null | wc -l)
          echo "Generated $count SEO asset files"
      
      - name: Upload SEO assets
        uses: actions/upload-artifact@v4
        with:
          name: seo-assets
          path: assets/seo-assets/
  
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    needs: [generate-rss, generate-sitemap, generate-seo]
    if: success()
    steps:
      - uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp -r blog deploy/
          cp -r dashboard deploy/
          cp -r assets deploy/
          cp sitemap/sitemap.xml deploy/
          cp rss-feed/feed.xml deploy/blog/
          echo "Deployment files prepared"
          ls -la deploy/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: victor-kipruto-rop.github.io
      
      - name: Deployment summary
        run: |
          echo "✅ Blog published successfully!"
          echo "📊 RSS feed updated: feed.xml"
          echo "🗺️ Sitemap updated: sitemap.xml"
          echo "🔍 SEO assets generated"
  
  notify:
    runs-on: ubuntu-latest
    name: Send Notifications
    needs: deploy
    if: always()
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Blog Publishing Workflow",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Blog Publishing Complete* ✅\n\n*Status:* ${{ job.status }}\n*Workflow:* Publish Blog & Generate Assets\n*Timestamp:* <!date^${{ github.event.head_commit.timestamp }}^{date_pretty} at {time_secs}|${{ github.event.head_commit.timestamp }}>"
                  }
                }
              ]
            }
        if: secrets.SLACK_WEBHOOK != '' && success()
      
      - name: Create deployment annotation
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/deploy-${new Date().toISOString().split('T')[0]}`,
              sha: context.sha
            })
