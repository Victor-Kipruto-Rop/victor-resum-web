name: 📢 Notify on Blog Post Publication

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'blog/**'
      - 'blog/posts.json'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    name: Send Notifications

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect blog post changes
        id: detect
        run: |
          echo "Checking for blog post changes..."
          
          # Get latest commit info
          if git diff HEAD~1..HEAD --name-only | grep -E 'blog/posts\.json|blog/posts/' >/dev/null 2>&1; then
            echo "Blog changes detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No blog changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/python/requirements.txt ]; then pip install -r scripts/python/requirements.txt; fi

      - name: Run notification system
        if: steps.detect.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
        run: |
          echo "🚀 Triggering notification system..."
          python automation/notifier.py
          echo "✅ Notifications sent!"

      - name: Log notification results
        if: steps.detect.outputs.changed == 'true'
        run: |
          if [ -f automation/notification_results.json ]; then
            echo "📊 Notification Results:"
            cat automation/notification_results.json
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-logs
          path: automation/notification.log
          retention-days: 7

  analytics-update:
    runs-on: ubuntu-latest
    name: Update Analytics Dashboard
    needs: notify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update post count in dashboard
        run: |
          echo "📈 Dashboard will auto-update when visitors arrive"
          echo "No backend update needed - analytics are client-side"

  slack-summary:
    runs-on: ubuntu-latest
    name: Send Slack Summary (Optional)
    if: always()

    steps:
      - name: Notify on Slack
        if: secrets.SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "📢 Blog Notification Workflow",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📢 Blog Post Published"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "New blog post published and notifications sent!\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}"
                  }
                }
              ]
            }
