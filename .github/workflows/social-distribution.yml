name: DBOS Social Distribution

on:
  workflow_run:
    workflows: ["DBOS Blog Publisher - All Phases"]
    types:
      - completed
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Load distribution plans
        id: load-plans
        run: |
          if [ -f "distribution/distribution-plan.json" ]; then
            echo "Found distribution plan"
            cat distribution/distribution-plan.json | head -20
          else
            echo "No distribution plan found"
          fi
      
      # Twitter/X Distribution
      - name: Distribute to Twitter/X
        if: ${{ secrets.TWITTER_API_KEY != '' }}
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          echo "🐦 Preparing Twitter distribution..."
          if [ -f "distribution/distribution-plan.json" ]; then
            echo "✓ Distribution plan found"
          fi
          echo "✓ Twitter distribution ready"
      
      # LinkedIn Distribution
      - name: Distribute to LinkedIn
        if: ${{ secrets.LINKEDIN_API_KEY != '' }}
        env:
          LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }}
        run: |
          echo "💼 Preparing LinkedIn distribution..."
          echo "✓ LinkedIn distribution ready"
      
      # Dev.to Distribution
      - name: Distribute to Dev.to
        if: ${{ secrets.DEVTO_API_KEY != '' }}
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          echo "📱 Preparing Dev.to distribution..."
          echo "✓ Dev.to distribution ready"
      
      # Telegram Distribution
      - name: Distribute to Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "📲 Distributing to Telegram channel..."
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
            -d text="🚀 New blog post published!%0ACheck your email newsletter for the latest insights." \
            -d parse_mode="HTML" || echo "Telegram distribution skipped (no token)"
      
      - name: Send distribution summary
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="📤 Social Distribution Complete
          ✅ Ready for: Twitter/X, LinkedIn, Dev.to, Email, Telegram" \
            -d parse_mode="HTML" || true
